# Prometheus Configuration for LogKeep
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'logkeep-production'
    environment: 'production'

# Alertmanager configuration for email alerts
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['logkeep-alertmanager:9093']

# Load alert rules
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['logkeep-node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'vps-primary'

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['logkeep-postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'logkeep'

  # LogKeep Application (Blue)
  - job_name: 'logkeep-blue'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep-blue:8000']
        labels:
          service: 'logkeep'
          slot: 'blue'
          environment: 'production'

  # LogKeep Application (Green)
  - job_name: 'logkeep-green'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep-green:8000']
        labels:
          service: 'logkeep'
          slot: 'green'
          environment: 'production'

  # LogKeep Staging
  - job_name: 'logkeep-staging'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['logkeep-staging:8000']
        labels:
          service: 'logkeep'
          slot: 'staging'
          environment: 'staging'

  # Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['logkeep-cadvisor:8080']
        labels:
          service: 'cadvisor'
          instance: 'vps-primary'

  # Nginx Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['logkeep-nginx-exporter:9113']
        labels:
          service: 'nginx'
          instance: 'vps-primary'
