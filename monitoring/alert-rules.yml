# Prometheus Alert Rules for LogKeep
groups:
  - name: logkeep_alerts
    interval: 30s
    rules:
      # Production Application Down - only alert if BOTH blue and green are down
      - alert: ProductionApplicationDown
        expr: sum(up{job=~"logkeep-(blue|green)"}) == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "LogKeep production application is completely down"
          description: "Both blue and green production containers are down. No production service is available."
      
      # Staging Container Down
      - alert: StagingContainerDown
        expr: up{job="logkeep-staging"} == 0
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "LogKeep staging container is down"
          description: "Staging container has been down for more than 5 minutes."

      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 85% for more than 5 minutes on {{ $labels.instance }}."

      # Critical CPU Usage
      - alert: CriticalCPUUsage
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical CPU usage detected"
          description: "CPU usage is above 95% on {{ $labels.instance }}. Immediate attention required."

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 90% for more than 5 minutes on {{ $labels.instance }}."

      # Critical Memory Usage
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical memory usage detected"
          description: "Memory usage is above 95% on {{ $labels.instance }}. System may become unstable."

      # Low Disk Space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Less than 20% disk space available on {{ $labels.instance }}."

      # Critical Disk Space
      - alert: CriticalDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical disk space"
          description: "Less than 10% disk space available on {{ $labels.instance }}. Immediate cleanup required."

      # Database Connection Pool
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database connection count"
          description: "PostgreSQL has {{ $value }} active connections, approaching pool limit."

      # High Response Time (if app exports metrics)
      # - alert: HighResponseTime
      #   expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
      #   for: 5m
      #   labels:
      #     severity: warning
      #     component: application
      #   annotations:
      #     summary: "High application response time"
      #     description: "95th percentile response time is above 2 seconds."

      # High Error Rate (if app exports metrics)
      # - alert: HighErrorRate
      #   expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      #   for: 5m
      #   labels:
      #     severity: warning
      #     component: application
      #   annotations:
      #     summary: "High error rate"
      #     description: "Error rate is above 5% for the last 5 minutes."

  - name: postgresql_alerts
    interval: 30s
    rules:
      # PostgreSQL Down
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding."

      # Too Many Connections
      - alert: PostgreSQLTooManyConnections
        expr: sum by (instance) (pg_stat_activity_count) > (pg_settings_max_connections * 0.8)
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL approaching connection limit"
          description: "PostgreSQL is using {{ $value }} connections, which is more than 80% of max_connections."

      # Replication Lag (if using replication)
      # - alert: PostgreSQLReplicationLag
      #   expr: pg_replication_lag > 10
      #   for: 5m
      #   labels:
      #     severity: warning
      #     component: database
      #   annotations:
      #     summary: "PostgreSQL replication lag"
      #     description: "Replication lag is {{ $value }} seconds behind master."

