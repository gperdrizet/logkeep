services:
  postgres:
    image: postgres:16-alpine
    container_name: logkeep-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logkeep_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logkeep-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: logkeep-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/logkeep?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - postgres
    networks:
      - logkeep-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    build: ..
    container_name: logkeep
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.production
    environment:
      - GUNICORN_WORKERS=9
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - logkeep-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  logkeep-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
