version: '3.8'

secrets:
  postgres_db:
    file: ../secrets/postgres_db.txt
  postgres_user:
    file: ../secrets/postgres_user.txt
  postgres_password:
    file: ../secrets/postgres_password.txt

services:
  postgres:
    image: postgres:16-alpine
    container_name: logkeep-postgres
    restart: unless-stopped
    volumes:
      - ../postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logkeep_user -d logkeep"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: logkeep-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ../ollama_models:/root/.ollama
      - ../scripts:/scripts:ro
    environment:
      - OLLAMA_NUM_GPU=1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_DEBUG=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    entrypoint: ["/scripts/ollama-entrypoint.sh"]

  app:
    build: ..
    container_name: logkeep
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    env_file:
      - .env
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
