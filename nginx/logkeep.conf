# LogKeep Production - Blue/Green Deployment
# Domain: logkeep.perdrizet.org

# Upstream configuration - Switch between blue (8001) and green (8002)
# During deployment, update the port number to switch traffic
# Note: Use localhost ports since system nginx can't resolve Docker container names
upstream logkeep_backend {
    server 127.0.0.1:8001;  # Blue container (change to 8002 for green during deployment)
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name logkeep.perdrizet.org;

    # Allow Let's Encrypt challenges (if switching from Ionos in future)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logkeep.perdrizet.org;

    # SSL Configuration - Ionos Wildcard Certificate
    ssl_certificate /etc/nginx/certs/perdrizet.org_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/perdrizet.org_starter_wildcard.key;
    
    # SSL Protocols and Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/perdrizet.org_fullchain.pem;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/logkeep-access.log;
    error_log /var/log/nginx/logkeep-error.log;
    
    # Client Settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Proxy Settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Root location - proxy to application
    location / {
        proxy_pass http://logkeep_backend;
        proxy_http_version 1.1;
        
        # WebSocket support (if needed in future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://logkeep_backend;
        access_log off;
    }
    
    # Static files are served by FastAPI application
    # Do NOT add a location /static/ block here - it will prevent proxying to the app
    # and cause 404 errors if the nginx alias path doesn't exist
    
    # Favicon
    location = /favicon.ico {
        proxy_pass http://logkeep_backend;
        access_log off;
    }
}
