# Root domain redirect
# Domain: perdrizet.org -> logkeep.perdrizet.org

# HTTP
server {
    listen 80;
    listen [::]:80;
    server_name perdrizet.org www.perdrizet.org;

    return 301 https://logkeep.perdrizet.org$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name perdrizet.org www.perdrizet.org;

    # SSL Configuration - Ionos Wildcard Certificate
    ssl_certificate /etc/nginx/certs/perdrizet.org_fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/perdrizet.org_starter_wildcard.key;
    
    # SSL Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Redirect to main application
    return 301 https://logkeep.perdrizet.org$request_uri;
}
