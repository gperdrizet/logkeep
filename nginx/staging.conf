# LogKeep Staging Environment
# Domain: staging.perdrizet.org
# This config proxies to the staging container on port 8003
# Access restricted to tailnet (100.64.0.0/24)

# Upstream configuration for staging container
upstream logkeep_staging {
    server 127.0.0.1:8003;  # Staging container (host port)
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name staging.perdrizet.org;

    # Allow Let's Encrypt challenges (if switching from Ionos in future)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.perdrizet.org;

    # SSL Configuration - managed by Certbot
    ssl_certificate /etc/letsencrypt/live/perdrizet.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perdrizet.org/privkey.pem;
    
    # SSL Protocols and Ciphers (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session Settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/staging-access.log;
    error_log /var/log/nginx/staging-error.log;

    # Tailnet-only access
    allow 100.64.0.0/24;
    deny all;

    # Proxy to FastAPI application
    location / {
        proxy_pass http://logkeep_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (localhost only, bypasses tailnet restriction)
    location /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://logkeep_staging/health;
        access_log off;
    }
}
