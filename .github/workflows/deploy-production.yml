name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            gperdrizet/logkeep:latest
            gperdrizet/logkeep:${{ github.sha }}
          cache-from: type=registry,ref=gperdrizet/logkeep:latest
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.VPS_HOST }}" >> ~/.ssh/config
          echo "  Port 44441" >> ~/.ssh/config
          echo "  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          echo "  UserKnownHostsFile ~/.ssh/known_hosts" >> ~/.ssh/config

      - name: Sync repository files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            cd /opt/logkeep
            git fetch origin
            git reset --hard origin/main
            echo "Repository updated to latest commit"
          EOF

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/logkeep
            
            echo "Starting deployment of $IMAGE_TAG..."
            
            # Run deployment script with shorter observation for CI/CD
            OBSERVATION_PERIOD=60 ./scripts/deploy.sh $IMAGE_TAG
            
            echo "Deployment completed!"
          EOF

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            # Wait for application to be ready
            sleep 10
            
            # Check health endpoint
            if curl -f https://logkeep.perdrizet.org/health > /dev/null 2>&1; then
              echo "[OK] Health check passed"
              exit 0
            else
              echo "[FAIL] Health check failed"
              exit 1
            fi
          EOF

      - name: Send notification on success
        if: success()
        run: |
          echo "### [OK] Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo " Application: https://logkeep.perdrizet.org" >> $GITHUB_STEP_SUMMARY
          echo " Monitoring: https://grafana.perdrizet.org" >> $GITHUB_STEP_SUMMARY

      - name: Send notification on failure
        if: failure()
        run: |
          echo "### [FAIL] Production Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[WARN]  Check logs and consider running rollback script" >> $GITHUB_STEP_SUMMARY

      - name: Rollback on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "Attempting automatic rollback..."
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            cd /opt/logkeep
            ./scripts/rollback.sh
          EOF
