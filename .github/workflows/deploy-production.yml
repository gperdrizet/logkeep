name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true
        default: ""

permissions:
  contents: write  # needed to create tags and releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation string must be 'deploy'. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi

  deploy-prod:
    needs: guard
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub → Settings → Environments

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          echo "$SSH_KEY" > "$KEY_FILE"

          ssh -i "$KEY_FILE" \
            -p 44441 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$USER@$HOST" bash -s -- "$DEPLOY_SHA" << 'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"

          DEPLOY_DIR=/opt/logkeep
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://github.com/gperdrizet/logkeep.git "$DEPLOY_DIR"
          fi

          git -C "$DEPLOY_DIR" fetch --prune origin
          git -C "$DEPLOY_DIR" checkout -f "$DEPLOY_SHA"

          cd "$DEPLOY_DIR"

          if ! docker compose --env-file docker/.env.production -f docker/docker-compose.prod.yml config >/dev/null; then
            echo "docker-compose.prod.yml failed validation on VPS"
            nl -ba docker/docker-compose.prod.yml | sed -n '1,120p'
            exit 1
          fi

          # Clean up stale containers that may exist outside the current compose project.
          # This avoids name conflicts with fixed container_name values in production compose.
          for name in logkeep-postgres logkeep-postgres-exporter logkeep; do
            if docker ps -a --format '{{.Names}}' | grep -Fxq "$name"; then
              docker rm -f "$name"
            fi
          done

          docker compose \
            --env-file docker/.env.production \
            -f docker/docker-compose.prod.yml \
            up --build -d --remove-orphans

          # Initialize database schema (idempotent).
          init_ok=0
          for attempt in $(seq 1 20); do
            if docker exec logkeep python -m src.cli.admin init-db; then
              init_ok=1
              break
            fi

            sleep 2
          done

          if [ "$init_ok" -ne 1 ]; then
            echo "Database initialization failed after retries"
            docker compose --env-file docker/.env.production -f docker/docker-compose.prod.yml logs --tail=200 app
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep '"status"'; then
              echo "Production deploy OK"
              exit 0
            fi

            sleep 2
          done

          echo "Production health check failed after waiting for startup"
          docker compose --env-file docker/.env.production -f docker/docker-compose.prod.yml ps
          docker compose --env-file docker/.env.production -f docker/docker-compose.prod.yml logs --tail=200 app
          exit 1
          REMOTE

          rm -f "$KEY_FILE"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes
