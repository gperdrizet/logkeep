name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true
        default: ""

permissions:
  contents: write  # needed to create tags and releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation string must be 'deploy'. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi

  deploy-prod:
    needs: guard
    runs-on: ubuntu-latest
    environment: production  # requires manual approval in GitHub → Settings → Environments

    steps:
      - uses: actions/checkout@v4.3.1

      - name: Deploy to production
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          echo "$SSH_KEY" > "$KEY_FILE"

          ssh -i "$KEY_FILE" \
            -p 44441 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$USER@$HOST" bash -s -- "$DEPLOY_SHA" << 'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"

          DEPLOY_DIR=/opt/logkeep
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://github.com/gperdrizet/logkeep.git "$DEPLOY_DIR"
          fi

          git -C "$DEPLOY_DIR" fetch --prune origin
          git -C "$DEPLOY_DIR" checkout -f "$DEPLOY_SHA"

          cd "$DEPLOY_DIR"

          if ! docker compose -f docker/docker-compose.prod.yml config >/dev/null; then
            echo "docker-compose.prod.yml failed validation on VPS"
            nl -ba docker/docker-compose.prod.yml | sed -n '1,120p'
            exit 1
          fi

          docker compose \
            -f docker/docker-compose.prod.yml \
            up --build -d --remove-orphans

          sleep 10
          curl -fsS http://127.0.0.1:8000/health | grep '"status"'
          echo "Production deploy OK"
          REMOTE

          rm -f "$KEY_FILE"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ github.event.inputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes
