name: Deploy to Staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy to staging'
        required: false
        default: 'dev'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/logkeep
            
            echo "Deploying to staging..."
            
            # Pull new image
            docker pull gperdrizet/logkeep:$IMAGE_TAG
            
            # Update staging container
            docker-compose -f docker-compose.staging.yml pull app-staging
            docker-compose -f docker-compose.staging.yml up -d app-staging
            
            echo "Staging deployment completed!"
          EOF

      - name: Wait for staging to be ready
        run: sleep 15

      - name: Run smoke tests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            # Test health endpoint
            if docker exec logkeep-staging curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Staging health check passed"
            else
              echo "❌ Staging health check failed"
              exit 1
            fi
            
            # Test database connectivity
            if docker exec logkeep-staging python -c "from src.utils.database import get_db; next(get_db())" > /dev/null 2>&1; then
              echo "✅ Database connectivity OK"
            else
              echo "⚠️  Database connectivity test skipped or failed"
            fi
          EOF

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Staging Deployment Successful!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🧪 Staging is ready for testing" >> $GITHUB_STEP_SUMMARY
            echo "🔗 Access staging at: http://${{ secrets.VPS_HOST }}:8003" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Staging Deployment Failed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details" >> $GITHUB_STEP_SUMMARY
          fi
