name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          echo "$SSH_KEY" > "$KEY_FILE"

          ssh -i "$KEY_FILE" \
            -p 44441 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$USER@$HOST" bash -s << 'REMOTE'
          set -euo pipefail

          DEPLOY_DIR=/opt/logkeep-staging
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://github.com/gperdrizet/logkeep.git "$DEPLOY_DIR"
          else
            git -C "$DEPLOY_DIR" pull --ff-only
          fi

          cd "$DEPLOY_DIR"

          # Remove any leftover containers from previous/failed deploys.
          # Match exact names to avoid accidental removals.
          docker ps -a --format '{{.Names}}' | grep -E '^logkeep(-postgres)?-staging$' || true
          docker ps -aq --filter name='^/logkeep-staging$' | xargs -r docker rm -f
          docker ps -aq --filter name='^/logkeep-postgres-staging$' | xargs -r docker rm -f

          COMPOSE_PROJECT_NAME=logkeep-staging docker compose \
            -f docker/docker-compose.staging.yml \
            up --build -d --remove-orphans

          sleep 15

          # Initialize database tables (idempotent, safe to run on every deploy)
          docker exec logkeep-staging python -m src.cli.admin init-db

          curl -fsS http://100.64.0.1:8003/health | grep '"status"'
          echo "Staging deploy OK"
          REMOTE

          rm -f "$KEY_FILE"
