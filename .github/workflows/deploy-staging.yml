name: Deploy Staging

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to staging
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          echo "$SSH_KEY" > "$KEY_FILE"

          ssh -i "$KEY_FILE" \
            -p 44441 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            "$USER@$HOST" bash -s << 'REMOTE'
          set -euo pipefail

          DEPLOY_DIR=/opt/logkeep-staging
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://github.com/gperdrizet/logkeep.git "$DEPLOY_DIR"
          else
            git -C "$DEPLOY_DIR" pull --ff-only
          fi

          cd "$DEPLOY_DIR"

          # Remove any leftover containers from previous/failed deploys
          docker rm -f logkeep-staging logkeep-postgres-staging 2>/dev/null || true

          COMPOSE_PROJECT_NAME=logkeep-staging docker compose \
            -f docker/docker-compose.staging.yml \
            up --build -d --remove-orphans

          sleep 15
          curl -fsS http://127.0.0.1:8003/health | grep '"status"'
          echo "Staging deploy OK"
          REMOTE

          rm -f "$KEY_FILE"
          fi
