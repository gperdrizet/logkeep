<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}LogKeep{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        // Initialize theme before page renders to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if user %}
    <header>
        <div class="container">
            <h1>
                LogKeep 
                <span class="repo-info">{{ user.username }}</span>
                <form action="/logout" method="post" style="display: inline;">
                    <button type="submit" class="logout-link">[logout]</button>
                </form>
            </h1>
            <nav>
                <a href="/dashboard">Links</a>
                <a href="/submit">Submit</a>
                <a href="/tags">Tags</a>
                <a href="/data">Data</a>
                <a href="/settings">Settings</a>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                    <span class="theme-icon">Dark</span>
                </button>
            </nav>
        </div>
    </header>
    {% endif %}
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            // Update button text
            const icon = document.querySelector('.theme-icon');
            if (icon) {
                icon.textContent = newTheme === 'light' ? 'Dark' : 'Light';
            }
        }
        
        // Set initial button text on page load
        document.addEventListener('DOMContentLoaded', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const icon = document.querySelector('.theme-icon');
            if (icon) {
                icon.textContent = currentTheme === 'light' ? 'Dark' : 'Light';
            }
        });
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
