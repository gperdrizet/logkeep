# Traefik Routes for Additional Services
# Static routes that don't use Docker labels

http:
  routers:
    grafana:
      rule: "Host(`grafana.perdrizet.org`)"
      entryPoints:
        - websecure
      service: grafana
      tls: {}
      priority: 100
    
    # Redirect root domain to logkeep
    root-redirect:
      rule: "Host(`perdrizet.org`)"
      entryPoints:
        - websecure
      service: logkeep-redirect
      middlewares:
        - logkeep-redirect
      tls: {}
      priority: 50

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://logkeep-grafana:3000"
    
    # Dummy service for redirect
    logkeep-redirect:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"

  middlewares:
    logkeep-redirect:
      redirectRegex:
        regex: ".*"
        replacement: "https://logkeep.perdrizet.org"
        permanent: true
